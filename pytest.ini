[pytest]
testpaths = tests
addopts = --alluredir=allure-results --clean-alluredir -ra
markers =
    smoke: fast checks that the feature is reachable
    regression: regression subset from the QA test plan (SCRUM-64)
    a11y: keyboard and screen-reader checks
    requires_holdings: needs a portfolio with priced holdings; skipped if seeding is not possible
